<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'AMS Manthan';
  src: url('AMS Manthan Regular/AMS Manthan Regular.ttf') format('truetype');
}
body { font-size: 24px; padding: 20px; }
.manthan { font-family: 'AMS Manthan', sans-serif; font-size: 36px; color: #b88d3e; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #ddd; padding: 8px; text-align: center; }
</style>
</head>
<body>
<h2>AMS Manthan Glyph Map (Keys 32 to 126)</h2>
<table>
<tr><th>Char</th><th>Key</th><th>AMS Manthan Glyph</th></tr>
<script>
for(let i=33; i<=126; i++){
  let ch = String.fromCharCode(i);
  document.write('<tr><td>'+i+'</td><td><code>'+ch+'</code></td><td class="manthan">'+ch+'</td></tr>');
}
</script>
</table>
</body>
</html>
