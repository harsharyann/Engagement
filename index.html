<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
/* Layout: full-screen cinematic chapters that auto-advance; ivory/blush with champagne gold; one gold-script moment per chapter */
:root{
  --ivory:#fdf9f4; --blush:#faeae6; --rose:#dc949d; --gold:#c49746; --gold-soft:#eed9a8; --gold-rich:#d4af37; --gold-dark:#997223;
  --ink:#3d1a21; --ink-soft:#6e444b; --deep:#2b1016; --royal-ruby:#6b1d2a;
  --display:'AMS Manthan','Cormorant Garamond','Tiro Devanagari Hindi','Georgia',serif; --script:'Pinyon Script','Snell Roundhand',cursive; --label:'Jost','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--display);font-size:20px;line-height:1.55;
  padding-left:0;padding-right:0;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
img{max-width:100%}
.sec{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding-top:72px;padding-bottom:120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;isolation:isolate}
.sec>*{max-width:min(720px,100%);min-width:0}
.bg1{background:radial-gradient(ellipse at 50% 0%,#fff 0,var(--ivory) 55%,var(--blush) 140%)}
.bg2{background:linear-gradient(180deg,var(--blush),var(--ivory) 70%)}
.bg3{background:radial-gradient(ellipse at 50% 100%,var(--blush),var(--ivory) 70%)}
.dark{background:radial-gradient(ellipse at 50% 30%,#5a3a3f,var(--deep));color:#f8ecdd}
.eyebrow{font-family:var(--label);font-weight:400;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance;line-height:1.08}
h2{font-size:clamp(34px,7vw,56px)}
.script{font-family:var(--script);font-weight:400;color:var(--gold);line-height:1.05}
.rule{width:140px;height:14px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 1px no-repeat;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--ivory);border:1px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.dark .rule::after{background:var(--deep)}
p{margin:0 0 1em}
.reveal{opacity:1;transform:none;transition:opacity 1.2s ease,transform 1.2s ease}
.js .reveal:not(.in){opacity:0;transform:translateY(26px)}
.flower{position:absolute;width:min(46vw,300px);aspect-ratio:1;z-index:-1;opacity:.9;pointer-events:none;animation:sway 9s ease-in-out infinite alternate}
.flower.tl{top:-6%;left:-10%}.flower.br{bottom:-6%;right:-10%;animation-delay:-4s}.flower.tr{top:-6%;right:-10%;animation-delay:-2s}.flower.bl{bottom:-6%;left:-10%;animation-delay:-6s}
@keyframes sway{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(5deg) scale(1.05)}}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
/* envelope */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#fff6ee,var(--blush));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity 1.6s ease,visibility 1.6s;padding:16px}
#intro.gone{opacity:0;visibility:hidden}
.intro-top{font-family:var(--label);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);text-align:center;opacity:0;animation:fadeup 1.6s .3s forwards}
.env{position:relative;margin-top:40px;width:min(84vw,400px);aspect-ratio:1.45;perspective:900px;opacity:0;animation:fadeup 1.4s .1s forwards}

.env .card{position:absolute;left:7%;right:7%;top:8%;bottom:8%;background:var(--ivory);border:1px solid var(--gold-soft);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform 1.4s .9s cubic-bezier(.6,.1,.2,1);padding:8px;text-align:center}
.env .card .script{font-size:clamp(26px,8vw,42px)}
.env .card small{font-family:var(--label);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}




.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-42%) scale(1.04)}
.intro-names{text-align:center;opacity:0;animation:fadeup 1.6s .8s forwards}
.intro-names .script{font-size:clamp(44px,13vw,84px)}
.intro-names p{font-style:italic;color:var(--ink-soft);margin:0 0 6px;font-size:clamp(18px,4.5vw,24px)}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* hero */
.photo-frame{width:min(72vw,360px,max(200px,calc((100svh - 500px)*.8)));aspect-ratio:4/5;border-radius:200px 200px 8px 8px;border:1px solid var(--gold);padding:8px;margin:0 auto 28px;background:var(--ivory);box-shadow:0 30px 60px -28px rgba(80,40,45,.5)}
.photo-frame .ph{width:100%;height:100%;border-radius:194px 194px 3px 3px;background-size:cover;background-position:center;overflow:hidden;position:relative}
.hero h1{font-size:clamp(30px,6.5vw,46px);font-style:italic;font-weight:400}
.hero .names{font-size:clamp(46px,min(16vw,11svh),104px);margin:2px 0}
.hero .rule{margin:12px auto}
.hero .photo-frame{margin-bottom:16px}
.deva{font-family:'AMS Manthan','Tiro Devanagari Hindi','Cormorant Garamond',serif;color:var(--gold);font-size:clamp(18px,4vw,22px);margin:0 0 10px;letter-spacing:.05em}
.date-line{font-family:var(--label);letter-spacing:.32em;text-transform:uppercase;font-size:13px;color:var(--ink)}
.photo-frame.duo{aspect-ratio:1/1.12;width:min(84vw,420px,max(230px,calc((100svh - 500px)*.9)))}
.ph.duo{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--gold-soft)}
.ph.duo div{background-size:cover;background-repeat:no-repeat}
/* story */
.story-wrap{display:grid;gap:28px;align-items:center;width:100%;max-width:900px;grid-template-columns:1fr}
@media(min-width:760px){.story-wrap{grid-template-columns:1fr 1fr}.sec>.story-wrap{max-width:900px}}
.story-photos{position:relative;aspect-ratio:4/5;width:min(78vw,340px,max(170px,calc((100svh - 560px)*.8)));margin:0 auto}
.story-photos .ph{position:absolute;inset:0;border-radius:6px;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease,transform 6s ease;transform:scale(1.06);border:6px solid #fff;box-shadow:0 20px 40px -20px rgba(60,30,35,.5)}
.story-photos .ph.on{opacity:1;transform:scale(1)}
.story-text{text-align:left}
.story-text h2{margin-bottom:14px}
.story-text p{font-size:clamp(17px,3.6vw,21px);color:var(--ink-soft)}
.story-line{display:inline-block;opacity:0;transform:translateY(12px);transition:all 1s}
.in .story-line{opacity:1;transform:none}
@media(max-width:759px){.story-text{text-align:center}}
/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.5vw,20px);width:100%;max-width:560px;margin-top:28px}
.cd div{border:1px solid rgba(227,207,159,.55);padding:18px 4px 12px;border-radius:4px;background:rgba(255,255,255,.04);min-width:0}
.cd b{display:block;font-weight:500;font-size:clamp(34px,10vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:var(--gold-soft)}
.cd span{font-family:var(--label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.8}
.dark h2{color:#fff3e0}
#cdDone{font-style:italic;color:var(--gold-soft);margin-top:18px;min-height:1.5em}
/* venue */
.venue-card{border:1px solid var(--gold);background:rgba(255,255,255,.6);padding:clamp(26px,6vw,48px) clamp(18px,5vw,48px);width:100%;max-width:560px;border-radius:2px;position:relative}
.venue-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);pointer-events:none}
.v-row{margin:0 0 20px}
.v-row small{display:block;font-family:var(--label);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.v-row strong{font-weight:500;font-size:clamp(24px,5.5vw,32px);overflow-wrap:anywhere}
.btn{display:inline-block;font-family:var(--label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#fff8e8;background:linear-gradient(135deg,#c9a45c,#a4802f);border:0;padding:15px 28px;border-radius:40px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(120,85,25,.7);transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--gold);box-shadow:none}
/* gallery */
.gal{position:relative;width:min(86vw,520px,max(200px,calc((100svh - 300px)*.8)));aspect-ratio:4/5;margin:26px auto 0;max-width:100%}
.gal .ph{position:absolute;inset:0;background-size:cover;background-position:center;border:8px solid #fff;border-radius:4px;opacity:0;transform:scale(1.04) rotate(.6deg);transition:opacity 1.5s ease,transform 5s ease;box-shadow:0 24px 50px -24px rgba(60,30,35,.55)}
.gal .ph.on{opacity:1;transform:none}
.dots{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold-soft);transition:all .4s}
.dots i.on{background:var(--gold);transform:scale(1.5)}
/* placeholders */
.ph.mono{display:grid;place-items:center;background:linear-gradient(160deg,#f7e3df,#ecc5c3 60%,#e6b9b9)}
.ph.mono .script{font-size:clamp(70px,20vw,130px);color:#fff;text-shadow:0 2px 20px rgba(150,90,95,.4)}
.ph.mono small{position:absolute;bottom:18px;left:0;right:0;font-family:var(--label);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#fff}
.letter{font-size:clamp(21px,4.4vw,27px);font-style:italic;color:var(--ink-soft);max-width:30em}
.closing .script{font-size:clamp(52px,15vw,96px);margin-top:10px}
.final h2{font-size:clamp(30px,6.4vw,50px);font-style:italic;font-weight:400}
.hi{display:block;font-family:'AMS Manthan','Tiro Devanagari Hindi','Cormorant Garamond',serif;font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;font-size:.86em;line-height:1.55;color:var(--ink-soft);margin-top:4px}
.eyebrow .hi{font-size:15px;color:var(--gold);margin-top:6px}
.dark .hi{color:var(--gold-soft)}
h1 .hi{font-size:.62em;color:var(--gold)}
.hnames{font-size:clamp(20px,4.6vw,26px);color:var(--ink);margin:0}
.cd span i.hi{display:block;font-style:normal;font-size:13px;letter-spacing:0;margin-top:2px;opacity:.9}
.v-row .hi{font-size:.72em}
.btn{letter-spacing:.14em}
.story-text .hi{color:var(--gold);margin-top:-6px;margin-bottom:1em;font-size:.95em}
.letter+.hi,.letter .hi{font-style:normal}
.hosts-box{margin:22px auto 6px}
.dn{font-family:'AMS Manthan','Tiro Devanagari Hindi','Cormorant Garamond',serif;font-weight:400;color:var(--gold);line-height:1.25}
.dn.names{font-size:clamp(40px,min(12vw,9svh),80px);margin:2px 0}
.dn.hostbig{font-size:clamp(40px,11vw,72px)}
.hostbig{margin-top:4px}
.stitle{color:var(--gold);font-size:clamp(34px,7vw,52px);margin-bottom:14px}
.script.stitle{font-size:clamp(40px,8vw,62px)}
.langtag{display:none!important;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--label);font-size:10px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:20px;background:rgba(253,248,241,.6)}
.intro-names p{margin:0 0 4px}
.cdDone{font-style:italic;color:var(--gold-soft);margin-top:18px;min-height:1.5em}
.lang-hi *{font-style:normal!important}
.lang-hi .eyebrow,.lang-hi .date-line,.lang-hi .v-row small,.lang-hi .cd span,.lang-hi .btn,.lang-hi .langtag{display:none!important;letter-spacing:.02em;text-transform:none;font-family:'AMS Manthan','Tiro Devanagari Hindi','Cormorant Garamond',serif}
.lang-hi .eyebrow{font-size:16px}
.lang-hi .date-line{font-size:17px}
.lang-hi .v-row small{font-size:15px}
.lang-hi .cd span{font-size:14px}
.lang-hi .btn{font-size:16px}
.lang-hi h1{font-size:clamp(32px,7vw,48px)}
/* controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transition:opacity 1s}
#ctrl.show{opacity:1}
#ctrl button{pointer-events:auto;font-family:var(--label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:rgba(253,248,241,.92);border:1px solid var(--gold);border-radius:30px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px)}
#ctrl button[hidden]{display:none!important}
#enableMusic{background:linear-gradient(135deg,#c9a45c,#a4802f)!important;color:#fff8e8!important;border-color:transparent!important}
#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--gold);z-index:60}
#gear{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:55;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(253,248,241,.85);color:var(--gold);cursor:pointer;font-size:18px;opacity:.55}
#gear:hover{opacity:1}
/* admin */
#admin{position:fixed;inset:0;z-index:200;background:rgba(40,20,24,.55);display:none;justify-content:flex-end}
#admin.open{display:flex}
.panel{width:min(480px,100%);height:100%;overflow:auto;background:var(--ivory);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px));font-family:var(--label);font-size:14px;color:var(--ink)}
.panel h3{font-family:var(--display);font-size:30px;margin-bottom:4px}
.panel fieldset{border:1px solid var(--gold-soft);border-radius:4px;margin:16px 0;padding:12px 14px}
.panel legend{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);padding:0 6px}
.panel label{display:block;margin:10px 0 3px;font-size:12px;color:var(--ink-soft)}
.panel input[type=text],.panel input[type=date],.panel input[type=time],.panel input[type=password],.panel textarea{width:100%;padding:9px 10px;border:1px solid var(--gold-soft);background:#fff;border-radius:3px;font:inherit;color:var(--ink)}
.panel textarea{min-height:84px;resize:vertical}
.panel input[type=range]{width:100%;accent-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative;width:64px;height:80px;border-radius:3px;background-size:cover;background-position:center;border:1px solid var(--gold-soft)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;line-height:1;font-size:12px}
.pbtn{font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;border-radius:30px;border:1px solid var(--gold);background:#fff;color:var(--ink);cursor:pointer}
.pbtn.main{background:var(--gold);color:#fff}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;padding:10px 0;background:var(--ivory)}
.msg{font-size:12px;color:var(--gold);min-height:1.2em;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes pulseHint{0%,100%{opacity:.9;transform:translateY(0)}50%{opacity:.45;transform:translateY(3px)}}.intro-tap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:var(--gold);font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;animation:pulseHint 2s infinite;z-index:10}
/* ===== LUXURY THEME & ANIMATIONS ===== */
@keyframes goldFoilShine{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
@keyframes glowPulse{
  0%,100%{opacity:0.4;transform:scale(0.96)}
  50%{opacity:0.8;transform:scale(1.05)}
}
@keyframes sealBreath{
  0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 15px rgba(212,175,55,0.4)}
  50%{transform:scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,0.6),0 0 25px rgba(212,175,55,0.7)}
}
@keyframes floatSubtle{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* Upgraded Names with 24K Royal Gold Gradient */
.names{
  background:linear-gradient(135deg,#7b1828 0%,#c49746 25%,#ffd700 50%,#b88628 75%,#54121d 100%)!important;
  background-size:220% auto!important;
  -webkit-background-clip:text!important;
  -webkit-text-fill-color:transparent!important;
  animation:goldFoilShine 6s ease-in-out infinite!important;
  filter:drop-shadow(0 2px 10px rgba(184,146,74,0.3));
}

/* Upgraded Countdown Boxes */
.cd div{
  border:1.5px solid rgba(212,175,55,0.5)!important;
  border-radius:12px!important;
  background:rgba(255,255,255,0.75)!important;
  backdrop-filter:blur(10px)!important;
  box-shadow:0 10px 25px -5px rgba(91,27,38,0.1),inset 0 0 15px rgba(212,175,55,0.08)!important;
  transition:transform .3s ease,box-shadow .3s ease!important;
}
.cd div:hover{
  transform:translateY(-4px)!important;
  box-shadow:0 15px 35px -5px rgba(91,27,38,0.18),0 0 20px rgba(212,175,55,0.35)!important;
}
.cd b{
  color:var(--gold-dark)!important;
  text-shadow:0 1px 2px rgba(255,255,255,0.8),0 0 12px rgba(212,175,55,0.35)!important;
}

/* Upgraded Photo Arch */
.photo-frame{
  border:2px solid var(--gold)!important;
  box-shadow:0 25px 60px -20px rgba(91,27,38,0.4),0 0 30px rgba(212,175,55,0.25)!important;
  animation:floatSubtle 6s ease-in-out infinite;
}

/* Upgraded Floating Bar */
#ctrl{
  background:rgba(255,253,248,0.88)!important;
  backdrop-filter:blur(16px)!important;
  border-top:1px solid rgba(212,175,55,0.35)!important;
  box-shadow:0 -8px 25px rgba(60,20,30,0.1)!important;
}
#ctrl button{
  border:1.5px solid var(--gold)!important;
  box-shadow:0 4px 12px rgba(184,146,74,0.15)!important;
  transition:all .25s ease!important;
}
#ctrl button:hover{
  background:var(--gold)!important;
  color:#fff!important;
  transform:translateY(-2px)!important;
}

/* ===== COOL 3D ROYAL ENVELOPE ===== */

.env-ambient-glow{
  position:absolute;width:min(90vw,440px);height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,0.35) 0%,rgba(212,175,55,0) 70%);
  filter:blur(35px);z-index:1;pointer-events:none;animation:glowPulse 3.5s infinite ease-in-out;
}

.env:hover{transform:translateY(-4px) scale(1.02)}

.inner-liner{
  position:absolute;inset:4px;
  background:repeating-linear-gradient(45deg,#48131e,#48131e 12px,#521623 12px,#521623 24px);
  border-radius:9px;opacity:0.8;
}
.ribbon{position:absolute;background:linear-gradient(135deg,#aa7c11,#ffd700 50%,#aa7c11);box-shadow:0 2px 8px rgba(0,0,0,0.35);z-index:2;pointer-events:none;transition:all 0.5s ease}
.ribbon-h{left:0;right:0;top:50%;height:20px;margin-top:-10px}
.ribbon-v{top:0;bottom:0;left:50%;width:20px;margin-left:-10px}
.env.open .ribbon{opacity:0;transform:scale(1.1)}



.flap-liner{position:absolute;inset:0;background:linear-gradient(180deg,rgba(212,175,55,0.35) 0%,transparent 80%)}
.env.open .flap{transform:rotateX(180deg);z-index:1;filter:drop-shadow(0 -4px 8px rgba(0,0,0,0.25))}




.env.open .seal{transform:scale(1.35) rotate(25deg);opacity:0;filter:blur(4px);pointer-events:none}

.env .card{
  position:absolute;left:5%;right:5%;top:6%;bottom:6%;
  background:linear-gradient(135deg,#fffefb 0%,#fef7ec 100%);
  border-radius:8px;box-shadow:0 15px 35px rgba(0,0,0,0.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:2;transition:transform 1.3s 0.35s cubic-bezier(0.2,0.8,0.2,1),box-shadow 1.3s 0.35s;
  border:1px solid rgba(212,175,55,0.5);padding:6px;
}
.card-border{
  width:100%;height:100%;border:1.5px solid var(--gold);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 8px;text-align:center;

/* ===== CINEMATIC PHOTO RATIO & STYLING ===== */
.photo-frame.duo{
  aspect-ratio: 1.25!important;
  width: min(88vw, 440px)!important;
  border-radius: 120px 120px 20px 20px!important;
  border: 2px solid var(--gold)!important;
  padding: 6px!important;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(252,244,236,0.65))!important;
  box-shadow: 0 25px 60px -15px rgba(110,50,60,0.32), 0 0 28px rgba(212,175,55,0.25)!important;
  animation: cinematicFloat 6s ease-in-out infinite!important;
  position: relative;
  overflow: hidden;
}
@keyframes cinematicFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.012)}
}

.photo-frame.duo .ph.duo{
  width: 100%!important;
  height: 100%!important;
  border-radius: 114px 114px 14px 14px!important;
  display: grid!important;
  grid-template-columns: 1fr 1fr!important;
  gap: 3px!important;
  background: linear-gradient(180deg, rgba(212,175,55,0.4), var(--gold) 50%, rgba(212,175,55,0.4))!important;
  overflow: hidden!important;
  position: relative;
}

.photo-frame.duo .ph.duo div{
  background-size: cover!important;
  background-repeat: no-repeat!important;
  transition: transform 6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.photo-frame.duo:hover .ph.duo div{
  transform: scale(1.04);
}

/* Subtle cinematic vignette shadow overlay */
.photo-frame.duo::after{
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 114px 114px 14px 14px;
  box-shadow: inset 0 0 25px rgba(60,20,30,0.22);
  pointer-events: none;
  z-index: 2;
}

  position:absolute;inset:0;

  border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(212,175,55,0.4);overflow:hidden;

.photo-frame.duo,
.story-photos{
  opacity: 0;
  transform: scale(0.68) translateY(32px);
  filter: blur(10px);
  transition: opacity 1.1s cubic-bezier(0.2, 0.8, 0.2, 1),
              transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1),
              filter 0.85s ease;
  will-change: transform, opacity, filter;
  position: relative;
}

.sec.in .photo-frame.duo,
.sec.in .story-photos,
.photo-frame.duo.pop-in,
.story-photos.pop-in{
  opacity: 1 !important;
  transform: scale(1) translateY(0) !important;
  filter: blur(0) !important;
}

/* Golden Halo Flare Burst when photo pops in */
.photo-frame.duo.pop-in::before,
.story-photos.pop-in::before{
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 125px 125px 25px 25px;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.55) 0%, rgba(212, 175, 55, 0.1) 50%, transparent 75%);
  z-index: -1;
  animation: haloFlareBurst 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  pointer-events: none;
}
.story-photos.pop-in::before{
  border-radius: 18px;
}

@keyframes haloFlareBurst{
  0%{ opacity: 0; transform: scale(0.8); }
  35%{ opacity: 1; transform: scale(1.12); filter: blur(10px); }
  100%{ opacity: 0.3; transform: scale(1); filter: blur(22px); }
}

/* ===== TYPEWRITER TEXT ANIMATION ===== */
.typewriter{
  min-height: 1.4em;
  opacity: 0.95;
  transition: opacity 0.4s ease;
}

.type-cursor{
  display: inline-block;
  color: var(--gold-dark);
  font-weight: 300;
  margin-left: 3px;
  animation: blinkTypeCursor 0.65s infinite alternate;
  vertical-align: baseline;
  text-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
}

@keyframes blinkTypeCursor{
  0%{ opacity: 1; transform: scaleY(1); }
  100%{ opacity: 0; transform: scaleY(0.85); }
}
/* ===== HERO CEREMONY TITLE (सगाई समारोह) ENHANCED ===== */
.hero-content h1 {
  font-family: 'Rozha One', 'Cinzel Decorative', serif !important;
  font-size: clamp(32px, 7vw, 52px) !important;
  font-weight: 400 !important;
  letter-spacing: .05em !important;
  line-height: 1.25 !important;
  margin: 6px 0 6px !important;
  text-align: center !important;
  background: linear-gradient(135deg, #7a2232 0%, #b88d3e 45%, #7a2232 95%) !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 12px !important;
}

.lang-hi .hero-content h1::before,
.lang-hi .hero-content h1::after {

/* ---------- IndexedDB for photos and music ---------- */
var db=null;
function idb(){return new Promise(function(res){
  try{var r=indexedDB.open('sr-invite',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
  r.onsuccess=function(){db=r.result;res(db)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function kvGet(k){return new Promise(function(res){if(!db)return res(null);try{var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function kvSet(k,v){return new Promise(function(res){if(!db)return res();try{var t=db.transaction('kv','readwrite');if(v==null)t.objectStore('kv').delete(k);else t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}

(function(){
  var c=$('petals'),x=c.getContext('2d');if(!x||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var W,H,P=[],dpr=Math.min(devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);

  function mk(init){
    var isGold=Math.random()<0.38;
    return{
      isGold:isGold,
      x:Math.random()*W,
      y:init?Math.random()*H:-20,
      s:isGold?(2+Math.random()*3):(5+Math.random()*8),
      v:isGold?(0.35+Math.random()*0.6):(0.45+Math.random()*0.8),
      w:Math.random()*Math.PI*2,
      r:Math.random()*6,
      vr:(Math.random()-.5)*0.03,
      c:isGold?['rgba(255,215,0,0.85)','rgba(240,195,90,0.8)','rgba(255,235,160,0.9)'][Math.floor(Math.random()*3)]
              :['rgba(224,110,130,0.7)','rgba(245,175,185,0.8)','rgba(212,140,150,0.75)'][Math.floor(Math.random()*3)]
    };
  }
  for(var i=0;i<30;i++)P.push(mk(true));

  var burstParticles=[];
  window.burstConfetti=function(bx,by){
    bx=bx||W*0.5;by=by||H*0.45;
    for(var k=0;k<55;k++){
      var angle=Math.random()*Math.PI*2;
      var speed=3+Math.random()*8;
      var isGold=Math.random()<0.65;
      burstParticles.push({
        x:bx,y:by,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,
        gravity:0.18,s:isGold?(3+Math.random()*4):(5+Math.random()*6),
        r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*0.16,
        alpha:1,decay:0.012+Math.random()*0.015,
        c:isGold?'#ffd700':'#e26b80'
      });
    }
  };

  (function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(function(p,i){
      p.y+=p.v;p.w+=0.014;p.x+=Math.sin(p.w)*0.7;p.r+=p.vr;
      if(p.y>H+20)P[i]=mk(false);
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();
      if(p.isGold){x.arc(0,0,p.s*0.5,0,6.283)}else{x.ellipse(0,0,p.s*0.55,p.s,0,0,6.283)}
      x.fill();x.restore();
    });

    for(var b=burstParticles.length-1;b>=0;b--){
      var bp=burstParticles[b];
      bp.x+=bp.vx;bp.y+=bp.vy;bp.vy+=bp.gravity;bp.r+=bp.vr;bp.alpha-=bp.decay;
      if(bp.alpha<=0){burstParticles.splice(b,1);continue}
      x.save();x.globalAlpha=Math.max(0,bp.alpha);
      x.translate(bp.x,bp.y);x.rotate(bp.r);x.fillStyle=bp.c;
      x.fillRect(-bp.s*0.5,-bp.s*0.5,bp.s,bp.s*1.2);x.restore();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ---------- typewriter animation engine ---------- */
function playTypewriterSequence(container, onComplete) {
  if (!container) return;
  var elements = container.querySelectorAll('.typewriter:not([data-typed="true"])');
  if (!elements || elements.length === 0) return;
  var arr = Array.prototype.slice.call(elements);

  function typeNext(index) {
    if (index >= arr.length) {
      if (onComplete) onComplete();
      return;
    }
    var el = arr[index];
    if (el.dataset.typing || el.dataset.typed) {
      typeNext(index + 1);
      return;
    }
    el.dataset.typing = 'true';
    var text = el.getAttribute('data-fulltext') || el.textContent;
    el.setAttribute('data-fulltext', text);
    el.textContent = '';
    el.style.opacity = '1';

    var cur = document.createElement('span');
    cur.className = 'type-cursor';
    cur.textContent = '|';
    el.appendChild(cur);

    var charIdx = 0;
    var speed = text.length > 80 ? 20 : 25;
    var timer = setInterval(function() {
      if (charIdx < text.length) {
        cur.insertAdjacentText('beforebegin', text.charAt(charIdx));
        charIdx++;
      } else {
        clearInterval(timer);
        el.dataset.typing = '';
        el.dataset.typed = 'true';
        setTimeout(function() {
          if (cur.parentNode) cur.parentNode.removeChild(cur);
          typeNext(index + 1);
        }, 160);
      }
    }, speed);
  }

  typeNext(0);
}

function builtIn(){

    var dl=ctx.createDelay(1);dl.delayTime.value=.42;var fb=ctx.createGain();fb.gain.value=.38;
    dl.connect(fb);fb.connect(dl);master.connect(lp);lp.connect(ctx.destination);master.connect(dl);dl.connect(lp);}

var CH=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]];

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)}

  while(nextT<ctx.currentTime+1.2){
    var bar=Math.floor(beat/8)%4,b=beat%8,ch=CH[bar];
    if(b===0){ch.slice(0,3).forEach(function(m){note(m-12,nextT,4.2,.05,'triangle')});note(ch[0]-24,nextT,4.2,.07,'sine')}
    var arp=[0,1,2,3,2,1,3,2][b];note(ch[arp]+12,nextT,1.6,.055,'sine');
    if(b===4&&bar%2===1)note(ch[3]+24,nextT+.25,2.2,.03,'sine');
    nextT+=.55;beat++}}

function nearest(){var m=scrollY+innerHeight*.4,k=0;secs.forEach(function(s,i){if(top(s)<=m)k=i});return k}

function dwell(){
  clearTimeout(dwellT);clearTimeout(panT);cancelAnimationFrame(barRaf);
  if(!running||paused)return;
  idx=nearest();
  if(idx>=secs.length-1){$('bar').style.width='100%';running=false;showCtrl();return}
  var id=secs[idx].getAttribute('data-kind'),mult=({story:1.4,family:1.4,event:1.2,hero:1.1})[id]||1;
  var el=secs[idx],extra=Math.max(0,el.offsetHeight-innerHeight);
  dwellLen=cfg.dur*1000*mult+(extra>8?3500:0);dwellStart=performance.now();
  if(extra>8)panT=setTimeout(function(){if(running&&!paused)scrollToSec(top(el)+extra,Math.max(1.5,dwellLen*.0004))},dwellLen*.3);
  (function bar(){
    var p=Math.min(1,(performance.now()-dwellStart)/dwellLen);
    $('bar').style.width=((idx+p)/(secs.length-1)*100)+'%';
    if(p<1)barRaf=requestAnimationFrame(bar);
  })();
  dwellT=setTimeout(next,dwellLen);
}

function next(){
  clearTimeout(dwellT);clearTimeout(panT);
  var k=Math.min(secs.length-1,nearest()+1);
  scrollToSec(top(secs[k]),cfg.speed,function(){if(running&&!paused)dwell();else showCtrl()});
}

function showCtrl(){
  var isAuto=running&&!paused;
  var ab=$('autoScrollBtn');
  if(ab){
    ab.textContent=isAuto?'\u23F8 Auto Scroll: On':'\u25B6 Auto Scroll: Off';
    ab.setAttribute('aria-pressed',isAuto);
  }
  if($('pauseBtn'))$('pauseBtn').hidden=!isAuto;
  if($('resumeBtn'))$('resumeBtn').hidden=isAuto;
}

function pause(){
  if(paused)return;
  paused=true;clearTimeout(dwellT);clearTimeout(panT);
  cancelAnimationFrame(anim);cancelAnimationFrame(barRaf);
  showCtrl();
}

function resume(){
  paused=false;running=true;showCtrl();dwell();
}

function toggleAutoScroll(){
  clearTimeout(autoResumeT);
  if(running&&!paused){
    autoScrollAllowed=false;
    pause();
  }else{
    autoScrollAllowed=true;
    resume();
  }
}

function onUserScroll(){
  if(!started)return;
  if(!autoScrollAllowed)return;
  if(running&&!paused){
    pause();
  }
  clearTimeout(autoResumeT);
  autoResumeT=setTimeout(function(){
    if(autoScrollAllowed&&paused&&nearest()<secs.length-1){
      resume();
    }
  },3500);
}

['wheel','touchstart'].forEach(function(ev){
  addEventListener(ev,onUserScroll,{passive:true});
});


if($('musicPill'))$('musicPill').onclick=function(){if(musicOn){wantMusic=false;musicOn=false;stopMusic();setMusicUI()}else{tryMusic()}};
if($('autoScrollBtn'))$('autoScrollBtn').onclick=toggleAutoScroll;
if($('pauseBtn'))$('pauseBtn').onclick=function(){autoScrollAllowed=false;pause()};
if($('resumeBtn'))$('resumeBtn').onclick=function(){autoScrollAllowed=true;resume()};
if($('skipBtn'))$('skipBtn').onclick=function(){
  var wasPaused=paused;clearTimeout(dwellT);clearTimeout(panT);cancelAnimationFrame(barRaf);
  var k=Math.min(secs.length-1,nearest()+1);
  scrollToSec(top(secs[k]),Math.min(cfg.speed,1.6),function(){
    if(running&&!paused&&!wasPaused)dwell();
    else showCtrl();
  });
};

document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.replay'))replayAll()});
function replayAll(){
  var tws=document.querySelectorAll('.typewriter');for(var ti=0;ti<tws.length;ti++){tws[ti].removeAttribute('data-typed');tws[ti].removeAttribute('data-typing');}
  var phs=document.querySelectorAll('.pop-in');for(var pi=0;pi<phs.length;pi++){phs[pi].classList.remove('pop-in');}

  autoScrollAllowed=true;paused=false;running=true;
  scrollToSec(0,Math.max(cfg.speed,2),function(){showCtrl();dwell()});
}

/* ---------- opening sequence ---------- */
var introSkipped=false;
function openEnvelopeNow(){
  if(introSkipped||started)return;
  introSkipped=true;
  tryMusic();if(window.burstConfetti)window.burstConfetti(innerWidth*0.5,innerHeight*0.45);$('env').classList.add('open');
  setTimeout(function(){
    $('intro').classList.add('gone');
    begin();
  },650);
}

$('intro').addEventListener('click',openEnvelopeNow);

function begin(){
  started=true;
  $('ctrl').classList.add('show');
  document.body.classList.remove('locked');
  scrollToSec.prog=false;
  window.scrollTo(0,0);
  running=true;
  paused=false;
  showCtrl();
  var heroPhotos=document.querySelectorAll('.sec.hero .photo-frame');for(var pi=0;pi<heroPhotos.length;pi++){heroPhotos[pi].classList.add('pop-in');}
  setTimeout(dwell,1000);
}

function intro(){
  document.body.classList.add('locked');
  tryMusic();setTimeout(function(){if(!introSkipped){if(window.burstConfetti)window.burstConfetti(innerWidth*0.5,innerHeight*0.45);$('env').classList.add('open')}},1800);
  setTimeout(function(){if(!introSkipped){$('intro').classList.add('gone');begin()}},4500);
}

/* ---------- admin ---------- */
var unlocked=false;
function openAdmin(){$('admin').classList.add('open');if(started&&running&&!paused)pause();
  $('lock').hidden=unlocked;$('aForm').hidden=!unlocked;if(unlocked)fill();else $('pin').focus()}
function closeAdmin(){$('admin').classList.remove('open')}
if($('gear'))$('gear').onclick=openAdmin;
document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeAdmin});
$('admin').addEventListener('pointerdown',function(e){if(e.target===$('admin'))closeAdmin()});
addEventListener('keydown',function(e){if(e.key==='Escape')closeAdmin()});
$('lock').onsubmit=function(e){e.preventDefault();
  if($('pin').value===cfg.pin){unlocked=true;$('aMsg').textContent='';$('lock').hidden=true;$('aForm').hidden=false;fill()}
  else $('aMsg').textContent='Passcode did not match.'};
var FIELDS={fBride:'bride',fGroom:'groom',fBrideHi:'brideHi',fGroomHi:'groomHi',fDate:'date',fTime:'time',fTimeText:'timeText',fTimeTextHi:'timeTextHi',
 fVenue:'venue',fVenueHi:'venueHi',fLoc:'loc',fLocHi:'locHi',fMap:'map',fOpen:'opening',fOpenHi:'openingHi',fStoryT:'storyTitle',fStoryTHi:'storyTitleHi',
 fFamT:'famTitle',fFamTHi:'famTitleHi',fHosts:'hosts',fHostsHi:'hostsHi',fFinal:'final',fFinalHi:'finalHi',fPin:'pin'};
var LISTS={fStory:'story',fStoryHi:'storyHi',fFam:'fam',fFamHi:'famHi'};
function fill(){
  for(var i in FIELDS)$(i).value=cfg[FIELDS[i]]||'';
  for(var j in LISTS)$(j).value=(cfg[LISTS[j]]||[]).join('\n');
  $('fDur').value=cfg.dur;$('fSpeed').value=cfg.speed;$('vDur').textContent=cfg.dur;$('vSpeed').textContent=cfg.speed;
  thumbs();$('musicName').textContent=musicBlob?'Custom music: '+(musicBlob.name||'uploaded file'):'Built-in melody is playing.'}
$('fDur').oninput=function(){$('vDur').textContent=this.value};
$('fSpeed').oninput=function(){$('vSpeed').textContent=this.value};
function lines(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
$('aForm').onsubmit=function(e){e.preventDefault();
  for(var i in FIELDS){var k=FIELDS[i],v=$(i).value.trim();cfg[k]=v||DEF[k]}
  if(!$('fMap').value.trim())cfg.map=cfg.venue+', '+cfg.loc;
  for(var j in LISTS){var l=lines($(j).value);cfg[LISTS[j]]=l.length?l:DEF[LISTS[j]]}
  cfg.dur=+$('fDur').value;cfg.speed=+$('fSpeed').value;
  lsSet();render();$('aMsg').textContent='Saved on this device.'};
$('aReset').onclick=function(){cfg=clone(DEF);lsSet();render();fill();$('aMsg').textContent='Details reset to the original invitation.'};
$('aExport').onclick=function(){var o=$('aOut');o.hidden=false;o.value=JSON.stringify(cfg,null,2);o.select();
  try{navigator.clipboard.writeText(o.value).then(function(){$('aMsg').textContent='Settings copied.'},function(){$('aMsg').textContent='Select the text below and copy it.'})}catch(e){$('aMsg').textContent='Select the text below and copy it.'}};
function shrink(file){return new Promise(function(res){var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b)},'image/jpeg',.86)};
  im.onerror=function(){URL.revokeObjectURL(u);res(null)};im.src=u})}
function urls(){
  [heroURL].concat(photoURLs).forEach(function(u){u&&URL.revokeObjectURL(u)});
  heroURL=heroBlob?URL.createObjectURL(heroBlob):'';photoURLs=photoBlobs.map(function(b){return URL.createObjectURL(b)})}
function thumbs(){$('thumbs').innerHTML='';photoURLs.forEach(function(u,i){var d=document.createElement('div');d.style.backgroundImage='url(\''+u+'\')';
  var b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Remove photo');
  b.onclick=function(){photoBlobs.splice(i,1);kvSet('photos',photoBlobs);urls();render();thumbs()};d.appendChild(b);$('thumbs').appendChild(d)})}
$('fHero').onchange=function(){var f=this.files[0];if(!f)return;shrink(f).then(function(b){if(!b)return;heroBlob=b;kvSet('hero',b);urls();render();$('aMsg').textContent='Hero photo updated.'})};
$('fPhotos').onchange=function(){var fs=Array.prototype.slice.call(this.files);var self=this;
  Promise.all(fs.map(shrink)).then(function(bs){bs.forEach(function(b){if(b)photoBlobs.push(b)});kvSet('photos',photoBlobs);urls();render();thumbs();self.value='';$('aMsg').textContent='Photos added.'})};
$('fMusic').onchange=function(){var f=this.files[0];if(!f)return;musicBlob=f;kvSet('music',f);
  if(musicURL)URL.revokeObjectURL(musicURL);musicURL=URL.createObjectURL(f);$('musicName').textContent='Custom music: '+f.name;
  stopSched();if(ctx&&master)master.gain.value=0;if(musicOn)tryMusic()};
$('musicReset').onclick=function(){musicBlob=null;kvSet('music',null);if(audioEl){audioEl.pause();audioEl.removeAttribute('src');audioEl.removeAttribute('data-src')}
  if(musicURL)URL.revokeObjectURL(musicURL);musicURL='';$('musicName').textContent='Built-in melody is playing.';if(musicOn)tryMusic()};

/* ---------- boot ---------- */
render();
idb().then(function(){return Promise.all([kvGet('hero'),kvGet('photos'),kvGet('music')])}).then(function(r){
  heroBlob=r[0];photoBlobs=r[1]||[];musicBlob=r[2];
  if(heroBlob||photoBlobs.length){urls();render()}
  if(musicBlob)musicURL=URL.createObjectURL(musicBlob)}).catch(function(){}).then(intro);
})();
</script>

</body></html>
